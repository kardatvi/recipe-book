<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашняя книга рецептов</title>
<style>
:root{color-scheme:light;--paper:#faf8f2;--ink:#252c25;--green:#294b3b;--line:#dfddcf;--white:#fffefa;--muted:#53584d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1.125rem/1.55 "Segoe UI",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #ad4c30;outline-offset:4px}
[hidden]{display:none!important}
.wrap{width:min(100% - 48px,1120px);margin:auto}
header{border-bottom:1px solid var(--line)}
header .wrap{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:750;text-decoration:none;color:var(--green);display:flex;gap:10px;align-items:center;line-height:1.15}
.brand svg{flex:none}
.button{min-height:48px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border:1px solid transparent;text-decoration:none;line-height:1.2}
.primary,.tab[aria-pressed=true]{background:var(--green);color:white;box-shadow:0 3px 0 #172d24}
.primary:hover,.tab[aria-pressed=true]:hover{background:#345d49}
.secondary,.tab{background:var(--white);color:var(--green);border-color:#a7b3a9;box-shadow:0 3px 0 #e8e6da}
.secondary:hover,.tab:hover{background:#edf3ea}
.hero{padding:45px 0 26px}
h1,h2,p,figure{margin:0}
h1,h2{font-family:Georgia,serif;letter-spacing:-.035em;line-height:1.1;font-weight:500}
h1{font-size:clamp(2.5rem,6vw,5rem)}
.hero p{margin-top:10px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:45px}
.card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--white);box-shadow:0 5px 0 #e8e6da}
.art{background-image:url("art-0.jpg");background-repeat:no-repeat;background-size:300% 100%;aspect-ratio:1.28;background-color:#f2dfaf}
.art-new{background-image:url("art-1.jpg");background-size:400% 500%;background-color:#faf2e4}
.category-salad{background:#ebedcf}
.draft-mark{font-size:1rem;font-weight:700;color:#6b462c}
.variant{margin-top:28px}
.variant>h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:7px}
.variant>.meta{margin-bottom:12px}
.detail-links{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px 20px;font-size:1rem}
.prep-preview{font-size:1rem;color:#5c4b28}
.art-omelet{background-position:0 50%}
.art-soup{background-position:50% 50%;background-color:#efcaba}
.art-meatballs{background-position:100% 50%;background-color:#edc3ba}
.card-body{display:flex;flex-direction:column;align-items:flex-start;flex:1;gap:11px;padding:18px}
.category{font-size:.875rem;font-weight:750;border-radius:6px;background:#fae5a3;padding:2px 8px}
.category-soup{background:#e1ece2}
.category-main{background:#f3ded5}
.card h2{font-size:clamp(1.65rem,2.8vw,2.15rem)}
.meta{font-size:1rem;font-weight:700}
.ingredients-preview{font-size:1rem;color:var(--muted)}
.recipe-link{margin-top:auto;width:100%}
.filters{background:var(--white);border:1px solid var(--line);border-radius:16px;margin-bottom:24px;padding:18px}
.filter-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
label{font-weight:700;display:grid;gap:5px;font-size:1rem;min-width:0}
input,select{width:100%;min-height:48px;padding:7px 10px;border:1px solid #859082;border-radius:8px;background:white;font-size:1rem}
.filter-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:15px}
.empty{padding:12px 0 45px;color:var(--muted)}
.recipe{padding:24px 0 48px}
.recipe-intro{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:32px;margin:22px 0 25px}
.recipe-intro .art{border-radius:15px}
.recipe-intro h1{font-size:clamp(2.2rem,6vw,4.7rem);margin:.25em 0}
figcaption{font-size:.875rem;color:var(--muted);margin-top:6px}
.recipe-columns{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,1.5fr);gap:20px;align-items:start}
.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,26px)}
.panel h2{font-size:2rem;margin-bottom:12px}
.panel ul,.panel ol{margin:0;padding-inline-start:1.35em}
.panel li{padding-inline-start:.2em}
.panel li+li{margin-top:10px}
.panel ol li::marker{font-weight:800;color:var(--green)}
.note{margin-bottom:14px;background:#f2eddb;padding:12px;border-radius:10px}
@media(max-width:840px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:610px){
.wrap{width:calc(100% - 28px)}
header .wrap{min-height:68px}
header .button{font-size:.9rem;padding-inline:9px}
.brand{font-size:1rem}
.hero{padding:30px 0 22px}
nav{gap:8px}
.tab{padding-inline:12px}
.grid,.filter-grid,.recipe-intro,.recipe-columns{grid-template-columns:1fr}
.recipe-intro{gap:16px}
}
</style>
</head>

const categories = { breakfast: 'Завтраки', soup: 'Супы', main: 'Горячее', salad: 'Салаты' };
const safetyUrl = 'https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures';

function meta(recipe) {
  return [...recipe.equipment, recipe.time].join(' · ');
}
const byId = (id) => document.getElementById(id);
const catalog = byId('catalog');
const recipeView = byId('recipe');
const filters = byId('filters');
const filterToggle = byId('filter-toggle');
const query = byId('query');
const ingredient = byId('ingredient');
const equipment = byId('equipment');
const tabs = [...document.querySelectorAll('[data-category]')];
let category = '';
let openedRecipe = '';

function append(parent, tag, text = '', className = '') {
  const element = document.createElement(tag);
  if (text) element.textContent = text;
  if (className) element.className = className;
  parent.append(element);
  return element;
}

function populate(select, label, values) {
  select.add(new Option(label, ''));
  for (const value of [...new Set(values)].sort((a, b) => a.localeCompare(b, 'ru'))) {
    select.add(new Option(value, value));
  }
}

function normalize(text) {
  return text.toLocaleLowerCase('ru').replaceAll('ё', 'е');
}

function drawArt(parent, recipe) {
  const hasTile = Number.isInteger(recipe.tile);
  const art = append(parent, 'div', '', hasTile ? 'art art-new' : 'art art-' + recipe.art);
  if (hasTile) {
    const column = recipe.tile % 4;
    const row = Math.floor(recipe.tile / 4);
    art.style.backgroundPosition = (column * 100 / 3) + '% ' + (row * 25) + '%';
  }
  art.setAttribute('role', 'img');
  art.setAttribute('aria-label', 'Набросок блюда «' + recipe.title + '»');
}

function renderCatalog() {
  const words = normalize(query.value).trim().split(/\s+/).filter(Boolean);
  const matches = recipes.filter((recipe) =>
    (!category || recipe.category === category) &&
    words.every((word) => normalize(recipe.title).includes(word)) &&
    (!ingredient.value || recipe.tags.includes(ingredient.value)) &&
    (!equipment.value || recipe.equipment.includes(equipment.value))
  );
  const grid = byId('cards');
  grid.replaceChildren();
  for (const recipe of matches) {
    const card = append(grid, 'article', '', 'card');
    drawArt(card, recipe);
    const body = append(card, 'div', '', 'card-body');
    append(body, 'span', categories[recipe.category], 'category category-' + recipe.category);
    append(body, 'h2', recipe.title);
    append(body, 'p', meta(recipe), recipe.draft ? 'draft-mark' : 'meta');
    append(body, 'p', recipe.cover, 'ingredients-preview');
    if (recipe.id === 'sushi-sandwich' || recipe.id === 'macaroni-cheese') {
      append(body, 'p', recipe.prep, 'prep-preview');
    }
    const open = append(body, 'a', 'Открыть рецепт', 'button secondary recipe-link');
    open.id = 'open-' + recipe.id;
    open.href = '#recipe-' + recipe.id;
    open.setAttribute('aria-label', 'Открыть рецепт «' + recipe.title + '»');
  }
  grid.hidden = matches.length === 0;
  byId('empty').hidden = matches.length > 0;
  byId('match-count').textContent = 'Найдено: ' + matches.length;
}

function renderRecipe(recipe) {
  recipeView.replaceChildren();
  const back = append(recipeView, 'a', 'К списку рецептов', 'button secondary');
  back.href = '#';
  const intro = append(recipeView, 'div', '', 'recipe-intro');
  const titleBlock = append(intro, 'div');
  append(titleBlock, 'span', categories[recipe.category], 'category category-' + recipe.category);
  const title = append(titleBlock, 'h1', recipe.title);
  title.tabIndex = -1;
  append(titleBlock, 'p', meta(recipe), recipe.draft ? 'draft-mark' : 'meta');
  const figure = append(intro, 'figure');
  drawArt(figure, recipe);
  append(figure, 'figcaption', 'Набросок блюда');

  if (recipe.draft) {
    append(recipeView, 'p', recipe.gap, 'note');
  } else if (recipe.variants) {
    for (const variant of recipe.variants) {
      const section = append(recipeView, 'section', '', 'variant');
      append(section, 'h2', variant.title);
      append(section, 'p', variant.equipment.join(' · '), 'meta');
      renderInstructions(section, variant);
    }
  } else {
    renderInstructions(recipeView, recipe);
  }
  const links = append(recipeView, 'div', '', 'detail-links');
  if (recipe.related) {
    const related = append(links, 'a', recipe.related[1]);
    related.href = '#recipe-' + recipe.related[0];
  }
  return title;
}

function renderInstructions(parent, recipe) {
  const columns = append(parent, 'div', '', 'recipe-columns');
  const pantry = append(columns, 'section', '', 'panel');
  append(pantry, 'h2', 'Ингредиенты');
  const list = append(pantry, 'ul');
  for (const item of recipe.ingredients) append(list, 'li', item);
  const method = append(columns, 'section', '', 'panel');
  append(method, 'h2', 'Как готовить');
  if (recipe.prep) append(method, 'p', recipe.prep, 'note');
  const steps = append(method, 'ol');
  for (const step of recipe.steps) append(steps, 'li', step);
  if (recipe.gap) append(method, 'p', recipe.gap, 'note');
  if (recipe.safety) {
    const note = append(method, 'p', recipe.safety + ' ', 'note');
    const link = append(note, 'a', 'FoodSafety.gov');
    link.href = safetyUrl;
  }
}

function showRoute() {
  const recipe = recipes.find((item) => location.hash === '#recipe-' + item.id);
  catalog.hidden = Boolean(recipe);
  recipeView.hidden = !recipe;
  filterToggle.setAttribute('aria-expanded', String(!recipe && !filters.hidden));
  document.title = recipe ? recipe.title + ' — Книга рецептов' : 'Домашняя книга рецептов';
  if (recipe) {
    openedRecipe = recipe.id;
    renderRecipe(recipe).focus({ preventScroll: true });
    window.scrollTo(0, 0);
  } else if (openedRecipe) {
    (byId('open-' + openedRecipe) || byId('catalog-title')).focus();
    openedRecipe = '';
  }
}

populate(ingredient, 'Любой ингредиент', recipes.flatMap((recipe) => recipe.tags));
populate(equipment, 'Любое оборудование', recipes.flatMap((recipe) => recipe.equipment));
for (const tab of tabs) {
  tab.addEventListener('click', () => {
    category = tab.dataset.category;
    for (const other of tabs) other.setAttribute('aria-pressed', String(other === tab));
    renderCatalog();
  });
}
filterToggle.addEventListener('click', () => {
  const inRecipe = Boolean(openedRecipe);
  if (inRecipe) {
    location.hash = '';
    showRoute();
  }
  filters.hidden = !inRecipe && !filters.hidden;
  filterToggle.setAttribute('aria-expanded', String(!filters.hidden));
  if (filters.hidden) filters.reset();
  else query.focus();
});
filters.addEventListener('submit', (event) => event.preventDefault());
query.addEventListener('input', renderCatalog);
ingredient.addEventListener('change', renderCatalog);
equipment.addEventListener('change', renderCatalog);
filters.addEventListener('reset', () => queueMicrotask(renderCatalog));
window.addEventListener('hashchange', showRoute);
renderCatalog();
showRoute();
</script>
</body>
</html>
